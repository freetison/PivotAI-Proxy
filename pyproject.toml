[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cascade-proxy"
version = "0.1.0"
description = "OpenAI-compatible cascading LLM proxy with JEV response evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.5,<3",
  "pyyaml>=6,<7",
  # Only the typesafe_decisions JEV dialect uses it; imported lazily so the
  # simple dialect keeps working without it installed.
  "typesafe-sdk>=0.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The default run is offline and deterministic: every provider and JEV call is
# mocked. Anything that spends real money lives in tests/integration/ behind the
# `integration` marker and only runs when asked for explicitly:
#   pytest -m integration tests/integration
addopts = "-m 'not integration'"
markers = [
  "integration: calls a real provider or a real JEV endpoint (needs credentials and CASCADE_RUN_INTEGRATION=1); excluded by default",
]

[tool.setuptools.packages.find]
include = ["src*"]
